name: "💡 Idee vorschlagen / Suggest an idea"
description: "Neue Funktion oder Verbesserung / New feature or improvement"
title: "[Idee] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Danke für deine Idee! Deutsch oder Englisch ist beides okay.
        Thanks for your idea! German or English is fine.
  - type: dropdown
    id: kind
    attributes:
      label: "Art / Type"
      options:
        - "Neue Funktion / New feature"
        - "Verbesserung einer Funktion / Improve a feature"
        - "Neue Einstellung in der Config / New config option"
        - "Übersetzung / Translation"
        - "Sonstiges / Other"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: "Deine Idee / Your idea"
      description: "Gerne mit Beispiel oder einem Mod, der das schon so macht / Feel free to add an example or a mod that already does it"
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: "Warum? / Why?"
      description: "Was würde das im Spiel verbessern? / What would it improve in the game?"
